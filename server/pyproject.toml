[project]
name = "chester-server"
version = "0.1.0"
description = "Authenticated chest radiograph research worklist."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pydicom>=3.0",
    "pylibjpeg>=2.1",
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.4",
    "pylibjpeg-rle>=2.0",
    # Sending a report is a feature of the application, not only of the gateway.
    "pynetdicom>=2.1",
    "python-multipart>=0.0.12",
    "scikit-image>=0.24",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
gateway = ["requests>=2.32"]
# torch is needed only to regenerate models/chester-all-224.onnx, never at runtime.
export = ["torch>=2.4", "torchxrayvision>=1.3", "onnx>=1.17", "onnxscript>=0.1"]
dev = ["httpx>=0.27", "moto[s3]>=5.0", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework's idiom.

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting generated revisions only creates diff noise.
"migrations/versions/*.py" = ["E501", "I001"]
